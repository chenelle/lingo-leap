<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Lingoleap</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.svg">
</head>

<body class="app-body">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="logo"
                style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 3rem;">
                <img src="assets/logo.svg" alt="Logo" style="height: 56px; width: auto;">
                Lingoleap
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
                <a href="library.html" class="nav-item">📚 My Library</a>
                <a href="progress.html" class="nav-item">📊 Progress</a>
                <a href="leaderboard.html" class="nav-item">🏆 Leaderboard</a>
                <a href="settings.html" class="nav-item active">⚙️ Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar" style="background: #22C55E;">You</div>
                <div class="user-info">
                    <div class="user-name">Student Name</div>
                    <div class="user-level">Lvl 5 Scholar</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Settings</h1>
            </header>

            <div class="settings-section">
                <h2 style="margin-bottom: 2rem;">Profile Information</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" value="Student Name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" value="student@example.com">
                </div>
                <div class="form-group">
                    <label>Target Exam</label>
                    <select class="form-control">
                        <option selected>IELTS Academic</option>
                        <option>IELTS General</option>
                        <option>CELPIP</option>
                    </select>
                </div>
                <button class="btn btn-secondary">Save Changes</button>
            </div>

            <div class="settings-section">
                <h2 style="margin-bottom: 2rem;">Preferences</h2>
                <div class="toggle-switch">
                    <div>
                        <strong>Daily Reminders</strong>
                        <p style="font-size: 0.9rem; color: var(--text-muted);">Get notified to keep your streak</p>
                    </div>
                    <!-- Mock Toggle Visual -->
                    <div
                        style="width: 50px; height: 26px; background: #22C55E; border-radius: 999px; position:relative; border: 2px solid #000;">
                        <div
                            style="width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; right: 2px; top: 1px; border: 2px solid #000;">
                        </div>
                    </div>
                </div>
                <div class="toggle-switch">
                    <div>
                        <strong>Sound Effects</strong>
                        <p style="font-size: 0.9rem; color: var(--text-muted);">Play sounds during quizzes</p>
                    </div>
                    <div
                        style="width: 50px; height: 26px; background: #E5E7EB; border-radius: 999px; position:relative; border: 2px solid #000;">
                        <div
                            style="width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; left: 2px; top: 1px; border: 2px solid #000;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-section" style="border-color: #EF4444;">
                <h2 style="color: #EF4444; margin-bottom: 1rem;">Danger Zone</h2>
                <button class="btn btn-outline" style="color: #EF4444; border-color: #EF4444;">Delete Account</button>
            </div>

        </main>
    </div>
</body>

</html>
