<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - AI Study Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.svg">
    <style>
        /* Quiz Specific Styles */
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .progress-track {
            flex: 1;
            height: 12px;
            background: #E5E7EB;
            border: 2px solid #000;
            border-radius: 999px;
            margin: 0 2rem;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #22C55E;
            width: 0%;
            /* Start at 0% */
            border-right: 2px solid #000;
            border-radius: 999px 0 0 999px;
            transition: width 0.3s;
        }

        .question-card {
            background: #fff;
            border: 2px solid #000;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 8px 8px 0 0 #000;
            margin-bottom: 2rem;
            flex: 1;
            /* take available space */
            display: flex;
            flex-direction: column;
        }

        .question-tag {
            display: inline-block;
            background: #BFDBFE;
            padding: 0.5rem 1rem;
            border: 2px solid #000;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            align-self: flex-start;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 1rem;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 1.25rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .option-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 0 #000;
            background: #F5F3F0;
        }

        .option-key {
            width: 30px;
            height: 30px;
            border: 2px solid #000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            background: #fff;
        }

        /* Logic States */
        .option-btn.selected {
            background: #BFDBFE;
            box-shadow: 4px 4px 0 0 #000;
        }

        .option-btn.correct {
            background: #22C55E;
            color: #fff;
        }

        .option-btn.correct .option-key {
            background: #22C55E;
            color: #fff;
            border-color: #22C55E;
        }

        .option-btn.wrong {
            background: #EF4444;
            color: #fff;
        }

        .option-btn.wrong .option-key {
            background: #EF4444;
            color: #fff;
            border-color: #EF4444;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        /* Helper for button states */
        .btn-success {
            background: #22C55E !important;
            color: #fff !important;
        }
    </style>
</head>

<body style="background: #F5F3F0;">

    <div class="quiz-container">
        <!-- Header -->
        <header class="quiz-header">
            <a href="dashboard.html" class="btn btn-outline" style="border:none; padding: 0.5rem;">✕ Close</a>
            <div class="progress-track">
                <div class="progress-bar" id="quiz-progress-bar" style="width: 0%;"></div>
            </div>
            <div class="pill pill-accent" style="margin:0;" id="quiz-score">💎 0 XP</div>
        </header>

        <!-- Question Card -->
        <main class="question-card" id="question-card">
            <div class="question-tag" id="question-tag">Loading...</div>
            <h2 class="question-text" id="question-text">Loading question...</h2>

            <div class="options-grid" id="options-grid">
                <!-- Options injected by JS -->
            </div>
        </main>

        <!-- Results Card (Hidden by default) -->
        <main class="question-card" id="results-card" style="display: none; text-align: center;">
            <div class="question-tag" style="background: #22C55E; color: white; align-self: center;">Quiz Completed
            </div>
            <h2 style="font-size: 2.5rem; margin: 2rem 0;">🎉 Great Job!</h2>
            <div style="font-size: 4rem; font-weight: 800; margin-bottom: 2rem;" id="final-score">0/0</div>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">You've earned <span id="final-xp">0</span> XP
                towards your daily goal.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="dashboard.html" class="btn btn-outline">Back Home</a>
                <button onclick="location.reload()" class="btn btn-primary">Try Again</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="quiz-footer" id="quiz-footer">
            <button class="btn btn-secondary" id="skip-btn">Skip</button>
            <button class="btn btn-primary" style="padding: 0.8rem 3rem;" id="check-btn">Check Answer</button>
        </footer>
    </div>

    <!-- Link Logic -->
    <script src="app.js"></script>

</body>

</html>
