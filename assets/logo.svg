<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for rotation and bounce -->
  <g transform="rotate(10 50 50)">
    <!-- Document background with thick border and shadow -->
    <rect x="25" y="20" width="50" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="5"/>
    <rect x="25" y="20" width="50" height="60" rx="8" fill="none" stroke="#000000" stroke-width="5" transform="translate(4, 4)" opacity="0.2"/>
    
    <!-- Big Bold Checkmark -->
    <path d="M35 50 L50 65 L75 35" stroke="#22C55E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Fun Accents / Sparks -->
    <path d="M85 25 L92 18" stroke="#FFC800" stroke-width="4" stroke-linecap="round"/>
    <path d="M80 15 L82 8" stroke="#FFC800" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Simple Face/Smile hint (optional, but requested 'fun') -> sticking to simple dynamic symbols -->
    <!-- Let's just keep it to the dynamic checkmark which implies success -->
  </g>
</svg>
