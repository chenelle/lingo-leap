<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(-5 50 50)">
    <!-- Book Base / Face -->
    <path d="M15 35 C15 35 30 25 50 35 C70 25 85 35 85 35 V75 C85 75 70 65 50 75 C30 65 15 75 15 75 V35 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Pages depth (bottom) -->
    <path d="M15 75 C15 75 30 65 50 75 C70 65 85 75 85 75" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <!-- Left Eye (Open) -->
    <circle cx="35" cy="55" r="5" fill="#1F2937"/>
    <!-- Right Eye (Winking) -->
    <path d="M60 55 L70 50 L70 60" fill="none" stroke="#1F2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="display:none;"/> <!-- simple wink -->
    <path d="M60 55 Q65 50 70 55" stroke="#1F2937" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Smile -->
    <path d="M40 70 Q50 75 60 70" stroke="#FFC800" stroke-width="4" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="28" cy="62" r="3" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="72" cy="62" r="3" fill="#FCA5A5" opacity="0.6"/>
    
    <!-- Energy/Idea Sparks -->
    <path d="M50 15 L50 25" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <path d="M25 20 L30 28" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
    <path d="M75 20 L70 28" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
