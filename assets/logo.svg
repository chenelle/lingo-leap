<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Refined Kawaii Frog Design 
    Palette:
    - Skin: #22C55E (Primary)
    - Outline/Eyes: #1F2937 (Text Main)
    - Cheeks: #FCA5A5 (Accent)
    - White: #FFFFFF
  -->

  <!-- Main Head Group -->
  <g transform="translate(256, 270) scale(1.1)">
    <!-- Head Outline -->
    <!-- Complex path to create the distinct eye bumps and wide face -->
    <path 
      fill="#22C55E" 
      stroke="#1F2937" 
      stroke-width="16" 
      stroke-linejoin="round"
      d="
        M -120 -40
        C -120 -80, -90 -130, -50 -130
        C -10 -130, -5 -80, 0 -70
        C 5 -80, 10 -130, 50 -130
        C 90 -130, 120 -80, 120 -40
        C 140 0, 140 80, 70 110
        C 30 130, -30 130, -70 110
        C -140 80, -140 0, -120 -40
        Z
      "
    />

    <!-- Left Eye -->
    <g transform="translate(-65, -75)">
      <!-- Sclera (optional, assuming big dark eyes like reference) -->
      <!-- The reference has big dark pupils filling most of the bump -->
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="#1F2937" />
      <!-- Big Highlight -->
      <ellipse cx="-10" cy="-10" rx="10" ry="12" fill="#FFFFFF" transform="rotate(-20)"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(65, -75)">
      <ellipse cx="0" cy="0" rx="28" ry="32" fill="#1F2937" />
      <!-- Big Highlight -->
      <ellipse cx="-10" cy="-10" rx="10" ry="12" fill="#FFFFFF" transform="rotate(-20)"/>
    </g>

    <!-- Nostrils -->
    <circle cx="-12" cy="10" r="3" fill="#1F2937" />
    <circle cx="12" cy="10" r="3" fill="#1F2937" />

    <!-- Cheeks -->
    <circle cx="-90" cy="40" r="18" fill="#FCA5A5" opacity="0.9"/>
    <circle cx="90" cy="40" r="18" fill="#FCA5A5" opacity="0.9"/>

    <!-- Mouth -->
    <path 
      fill="none" 
      stroke="#1F2937" 
      stroke-width="10" 
      stroke-linecap="round" 
      d="M -50 35 Q 0 75, 50 35"
    />
    <!-- Tiny mouth corners -->
    <path 
      fill="none" 
      stroke="#1F2937" 
      stroke-width="10" 
      stroke-linecap="round" 
      d="M -50 34 L -52 28 M 50 34 L 52 28"
    />
  </g>
</svg>
